# Render Blueprint: New > Blueprint > pick this repo. Render asks for GROQ_API_KEY.
services:
  - type: web
    name: medialert
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MEDALERT_DEMO_MODE
        value: "1"
      - key: MEDALERT_TIMEZONE
        value: Africa/Dar_es_Salaam
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
